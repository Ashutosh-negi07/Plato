spring:
  application:
    name: Plato

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PlatoHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate only checks it
    show-sql: false
    open-in-view: false           # never hold a DB connection open across the HTTP layer
    properties:
      hibernate:
        format_sql: false
        # dialect is auto-detected from the JDBC driver — no need to set it explicitly

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false    # do not apply baseline on an existing non-empty schema

# ── Server ─────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Plato Custom Properties ─────────────────────────────────────────────────
plato:
  jwt:
    secret: ${JWT_SECRET}              # required — set in env or application-local.yml
    expiration: 86400000               # 24 hours in milliseconds
  session:
    timeout-minutes: 30                # customer session inactivity timeout
  qr:
    base-url: ${QR_BASE_URL:http://localhost:3000/qr}   # prefix for QR code URLs
  seed:
    admin:
      email: ${ADMIN_EMAIL}            # required — set in env or application-local.yml
      password: ${ADMIN_PASSWORD}      # required — set in env or application-local.yml
      name: ${ADMIN_NAME:Super Admin}  # display name for the seeded super admin

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.miniproject.plato: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
